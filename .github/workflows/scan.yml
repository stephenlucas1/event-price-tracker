name: Price Scan

# GitHub's cron scheduler throttles free-tier schedules by hours, so the
# real cadence comes from self-chaining: one job scans every 15 minutes for
# ~5.5 h (public repo = unlimited minutes, 6 h job cap), then dispatches its
# own successor via the CHAIN_PAT secret. The cron below is only a fallback
# that restarts the chain if a run dies or the secret is missing.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

# Keeps duplicates from cron + chain harmless: only the newest pending run
# in the group is kept queued while one runs.
concurrency:
  group: cv-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan every 15 min for ~5.5 h
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          VAPID_PUBLIC_KEY:  ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CLAIM_EMAIL: ${{ secrets.VAPID_CLAIM_EMAIL }}
          # Secret, not var: public Actions logs would show a var's value,
          # and the city list narrows down who runs this.
          # Leave CV_CITIES UNSET to scan every region. If it is set, this
          # runner prunes every row outside that scope on each pass — which
          # is correct for a single runner and destructive if another one is
          # covering the rest. cv_scan.py's prune ceiling aborts rather than
          # mass-delete, but the fix is to not set it.
          CV_CITIES:     ${{ secrets.CV_CITIES }}
          # Set ONLY if CrowdVolt's bot gate turns out to score datacenter IPs
          # as well as TLS fingerprints — the impersonation in cv_scanner._get
          # is verified from a residential IP, not from this runner. Secret,
          # never a var: it carries proxy credentials and these logs are public.
          CV_PROXY:       ${{ secrets.CV_PROXY }}
          CV_IMPERSONATE: ${{ secrets.CV_IMPERSONATE }}
          CV_MAX_EVENTS: ${{ vars.CV_MAX_EVENTS }}
          CV_DROP_PCT:   ${{ vars.CV_DROP_PCT }}
          CV_HOME_REGION: ${{ secrets.CV_HOME_REGION }}
          CV_BUDGET_S:    ${{ vars.CV_BUDGET_S }}
          # Drop-sniper tuning. Secrets rather than vars: a var's value is
          # printed in public run logs, and these thresholds are the strategy.
          # All have working defaults, so leaving them unset is fine.
          CV_POPULAR_MIN: ${{ secrets.CV_POPULAR_MIN }}
          CV_HOT_SALES:   ${{ secrets.CV_HOT_SALES }}
          CV_HOT_DEMAND:  ${{ secrets.CV_HOT_DEMAND }}
          CV_HOT_DAYS:    ${{ secrets.CV_HOT_DAYS }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO:           ${{ secrets.ALERT_TO }}
        run: |
          end=$(( $(date +%s) + 5*3600 + 30*60 ))
          cycle=0
          ok=0
          failed=0
          while true; do
            pass_start=$(date +%s)
            # cv_scan.py supersedes cv_scanner.py (which is now just the
            # fetch/parse layer it imports). Running both would double-write
            # cv_history and double-count cv_sales_seen.
            #
            # The sniper only runs on a SUCCESSFUL scan. After a failed pass
            # the stored lows are last cycle's, so every comparison would be
            # stale-vs-stale — silence that looks like "no drops".
            if python cv_scan.py; then
              ok=$(( ok + 1 ))
              python cv_drop_alert.py || echo "::warning::drop alert failed, continuing"
            else
              failed=$(( failed + 1 ))
              echo "::warning::scan pass failed, skipping drop alert"
            fi
            # AXS pages change slowly; poll hourly (every 4th cycle) to stay polite
            if [ $(( cycle % 4 )) -eq 0 ]; then
              python axs_monitor.py || echo "::warning::axs pass failed, continuing"
            fi
            cycle=$(( cycle + 1 ))
            [ "$(date +%s)" -ge "$end" ] && break
            sleep_for=$(( 900 - ( $(date +%s) - pass_start ) ))
            [ "$sleep_for" -gt 0 ] && sleep "$sleep_for"
          done
          echo "passes: $ok ok, $failed failed"
          # Every pass failing used to still exit 0, because the `if` above
          # swallows it. That is how the 2026-08-04 CrowdVolt bot gate stayed
          # invisible for a day: green runs, 5.5 h each, writing nothing.
          # A run that never once scanned is a dead feed, not an idle one.
          if [ "$ok" -eq 0 ]; then
            echo "::error::every scan pass failed ($failed) — the feed is DOWN, not idle"
            exit 1
          fi

      - name: Chain next run
        if: always()
        env:
          CHAIN_PAT: ${{ secrets.CHAIN_PAT }}
        run: |
          if [ -z "$CHAIN_PAT" ]; then
            echo "CHAIN_PAT not set - relying on fallback cron"
            exit 0
          fi
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CHAIN_PAT" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/scan.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "next run dispatched" \
            || echo "::warning::chain dispatch failed - fallback cron will recover"
